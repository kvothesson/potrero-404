<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1830">
<title>Potrero 404</title>
<meta name="description" content="Fútbol con autos en la Ruta 404, de noche, con una Luz Mala de pelota. Online por link, sin cuenta, en la compu o en el celu.">
<meta property="og:title" content="Potrero 404">
<meta property="og:description" content="Fútbol con autos en la Ruta 404, de noche, con una Luz Mala de pelota. Online por link, sin cuenta.">
<meta property="og:url" content="https://kvothesson.com/potrero-404/">
<style>
  html, body { margin: 0; height: 100%; background: #1c1830; overflow: hidden; }
  body { display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body.tactil { place-items: start center; padding-top: env(safe-area-inset-top); }
  canvas { display: block; image-rendering: pixelated; outline: none; }
  /* en iPhone, sin esto no se puede escribir en los campos (el body bloquea la selección de texto) */
  input, #cuenta, #entrada { -webkit-user-select: text; user-select: text; touch-action: manipulation; }

  /* controles táctiles: el tamaño sigue a la pantalla (celu chico, celu grande, tablet) */
  :root { --b: clamp(56px, 13vmin, 96px); --pal: clamp(100px, 28vmin, 170px); }
  #tactil { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  #tactil.oculto { display: none; }
  .zona-palanca { position: absolute; left: 0; bottom: 0; width: 55%; height: 42%; pointer-events: auto; touch-action: none; }
  .base { position: absolute; width: var(--pal); height: var(--pal); margin: calc(var(--pal) / -2) 0 0 calc(var(--pal) / -2); border-radius: 50%;
    background: rgba(255,255,255,.08); border: 3px solid rgba(255,255,255,.4); display: none; }
  .base.visible { display: block; }
  .base.quieta { display: block; opacity: .4;
    left: calc(env(safe-area-inset-left, 0px) + var(--pal) * .75); top: calc(100% - env(safe-area-inset-bottom, 0px) - var(--pal) * .75); }
  .perilla { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; border-radius: 50%;
    background: rgba(255,255,255,.55); border: 3px solid #140f22; transform: translate(-50%,-50%); }
  .botones { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(26px, calc(env(safe-area-inset-bottom) + 18px));
    display: grid; grid-template-areas: ". salto" "freno nitro"; gap: 24px 12px; pointer-events: auto; align-items: end; justify-items: center; }
  .boton { position: relative; width: var(--b); height: var(--b); border-radius: 50%; border: 3px solid #140f22; background: #4a4470;
    box-shadow: 0 5px 0 #2a2448; touch-action: none; display: grid; place-items: center; padding: 0; }
  .boton.activo { transform: translateY(4px); box-shadow: 0 1px 0 #2a2448; filter: brightness(1.35); }
  .boton .etq { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
    font: 700 11px/1 system-ui, sans-serif; letter-spacing: .5px; color: rgba(255,255,255,.75); text-shadow: 0 1px 0 #000; }
  /* nitro: más grande, y el aro muestra cuánto te queda */
  .boton.nitro { grid-area: nitro; width: calc(var(--b) * 1.2); height: calc(var(--b) * 1.2); box-shadow: 0 5px 0 #7a3a08;
    background: radial-gradient(circle, #e07818 0 66%, transparent 67%), conic-gradient(#fff4b0 calc(var(--n, 100) * 1%), #3a2410 0); }
  .boton.nitro.vacio { filter: grayscale(.8) brightness(.7); }
  .boton.salto { grid-area: salto; }
  .boton.freno { grid-area: freno; }
  .icono { width: 48%; height: 48%; image-rendering: pixelated; pointer-events: none; }
  /* acostado: el juego ocupa el alto; palanca a la izquierda sin tapar el botón de pausa */
  @media (orientation: landscape) {
    :root { --b: clamp(52px, 15vmin, 88px); --pal: clamp(96px, 30vmin, 160px); }
    body.tactil { place-items: center; padding-top: 0; }
    .zona-palanca { width: 42%; height: 80%; }
    .botones { gap: 20px 10px; }
  }
  /* nombre o código de respaldo: un campo y un ✓, encima del canvas */
  #entrada { position: fixed; left: 50%; top: 44%; transform: translate(-50%, -50%); display: flex; gap: 8px; z-index: 3; }
  #entrada.oculto { display: none; }
  #entrada input { width: min(62vw, 260px); font: 600 20px/1 ui-monospace, Consolas, monospace; text-transform: uppercase;
    padding: 10px 12px; background: #140f22; color: #fff4b0; border: 3px solid #9890b8; border-radius: 4px; outline: none; }
  #entrada input:focus { border-color: #fff4b0; }
  #entrada button { width: 52px; font: 700 24px/1 system-ui, sans-serif; background: #2f8f6a; color: #fff; border: 3px solid #140f22;
    border-radius: 4px; box-shadow: 0 4px 0 #1c5a42; cursor: pointer; }
  /* cuenta: entrar o jugar como invitado, un paso por pantalla (src/cuenta.js) */
  #cuenta { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; width: min(92vw, 360px);
    max-height: 92vh; overflow: auto; padding: 18px 18px 16px; background: #140f22; border: 3px solid #4a4470; border-radius: 6px;
    box-shadow: 0 6px 0 #0c0a14; color: #e8e4ff; font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; box-sizing: border-box; }
  #cuenta.oculto { display: none; }
  #cuenta h2 { margin: 0 28px 10px 0; font-size: 19px; color: #fff4b0; font-weight: 700; }
  #cuenta h3 { margin: 0 0 2px; font-size: 16px; color: #fff; }
  #cuenta p { margin: 0 0 12px; color: #b8b2dc; }
  #cuenta p b { color: #fff; }
  #cuenta .x { position: absolute; right: 8px; top: 6px; width: 34px; height: 34px; background: none; border: 0; color: #9890b8; font-size: 26px; cursor: pointer; }
  #cuenta .opcion { display: block; width: 100%; text-align: left; padding: 12px; margin: 0 0 10px; background: #1c1830; border: 2px solid #4a4470;
    border-radius: 6px; color: inherit; font: inherit; cursor: pointer; box-sizing: border-box; }
  #cuenta .opcion.fuerte { border-color: #2f8f6a; cursor: default; }
  #cuenta .opcion p { margin: 0 0 10px; font-size: 14px; }
  #cuenta button.opcion p { margin: 0; }
  #cuenta button.opcion:hover, #cuenta button.opcion:focus-visible { border-color: #9890b8; }
  #cuenta .google { margin: 0 0 8px; min-height: 44px; }
  #cuenta .btn { display: block; width: 100%; min-height: 44px; padding: 10px; font: 600 16px/1 system-ui, sans-serif; color: #fff; background: #4a4470;
    border: 0; border-radius: 4px; box-shadow: 0 4px 0 #2a2448; cursor: pointer; }
  #cuenta .btn.verde { background: #2f8f6a; box-shadow: 0 4px 0 #1c5a42; }
  #cuenta .btn:disabled { opacity: .5; }
  #cuenta form { display: flex; flex-direction: column; gap: 10px; margin: 0 0 12px; }
  #cuenta input { font: 600 18px/1 ui-monospace, Consolas, monospace; padding: 11px 12px; background: #0c0a14; color: #fff4b0;
    border: 3px solid #9890b8; border-radius: 4px; outline: none; min-width: 0; }
  #cuenta input.codigo { letter-spacing: 8px; text-align: center; font-size: 24px; }
  #cuenta input:focus { border-color: #fff4b0; }
  #cuenta .volver { background: none; border: 0; color: #c8f4ff; font: inherit; cursor: pointer; padding: 6px 0; text-decoration: underline; }
  #cuenta .error { color: #ff8a8a; margin: 4px 0 0; }
  #entrada.error input { border-color: #ff5a6e; animation: temblar .25s; }
  @keyframes temblar { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  /* vuelta a la portada de kvothesson.com, chiquita en una esquina */
  .casa { position: fixed; left: 8px; bottom: 6px; font: 11px/1 ui-monospace, Consolas, monospace; color: #8a84b0;
    text-decoration: none; opacity: .55; z-index: 1; }
  .casa:hover, .casa:focus-visible { opacity: 1; color: #fff4b0; }
  .casa.ranking { left: auto; right: 8px; }
  body.tactil .casa { display: none; }
</style>
</head>
<body>
<canvas id="juego" tabindex="0" aria-label="Potrero 404"></canvas>
<a class="casa" href="https://kvothesson.com/">kvothesson.com</a> <a class="casa ranking" href="ranking/">ranking</a>
<script type="module" src="src/main.js"></script>
</body>
</html>
