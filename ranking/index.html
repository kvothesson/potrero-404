<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c1830">
<title>Potrero 404 · Ranking</title>
<meta name="description" content="Ranking de Potrero 404: humanos e IAs por Elo. Se actualiza solo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --fondo: #1c1830; --panel: #140f22; --linea: #2a2448; --texto: #e8e4ff; --tenue: #8a84b0; --oro: #ffd040; --elo: #fff4b0; --vos: #2f8f6a; --ia: #9890b8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fondo); color: var(--texto); }
  body { font: 12px/1.6 'Press Start 2P', ui-monospace, Consolas, monospace; min-height: 100vh; display: flex; justify-content: center; padding: 24px 16px 48px; }
  main { width: 100%; max-width: 640px; }
  h1 { margin: 0 0 4px; font-size: clamp(20px, 6vw, 32px); color: #fff4b0; text-shadow: 3px 3px 0 #7a2a10; letter-spacing: 1px; }
  h1 span { color: #ffb030; }
  .sub { color: var(--tenue); margin: 0 0 20px; font-size: 10px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .vivo { display: inline-block; width: 8px; height: 8px; background: #7cf09a; margin-right: 6px; animation: titila 1.2s steps(2) infinite; }
  @keyframes titila { 50% { opacity: .2; } }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 3px solid var(--linea); }
  th { color: var(--tenue); font-weight: normal; text-align: left; padding: 10px 8px; border-bottom: 3px solid var(--linea); font-size: 10px; }
  td { padding: 9px 8px; border-bottom: 1px solid var(--linea); white-space: nowrap; }
  td.nombre { white-space: normal; word-break: break-word; }
  .num { text-align: right; }
  .pos { color: var(--tenue); width: 3.5em; }
  tr.podio .pos { color: var(--oro); }
  td.elo { color: var(--elo); }
  .robot { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px; image-rendering: pixelated; }
  tr.ia .nombre { color: var(--ia); }
  tr.vos { background: var(--vos); }
  tr.vos td { color: #fff; }
  .separa td { padding: 2px; background: var(--linea); }
  .acciones { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
  a.boton { display: inline-block; padding: 12px 16px; background: #2f8f6a; color: #fff; text-decoration: none; border: 3px solid #140f22; box-shadow: 0 4px 0 #1c5a42; }
  a.boton.gris { background: #4a4470; box-shadow: 0 4px 0 #2a2448; }
  a.boton:focus-visible { outline: 3px solid #fff4b0; outline-offset: 2px; }
  .estado { color: var(--tenue); padding: 24px 8px; text-align: center; }
  .cuenta { margin-top: 28px; background: var(--panel); border: 3px solid var(--linea); padding: 16px; }
  .cuenta h2 { margin: 0 0 10px; font-size: 12px; color: #fff4b0; }
  .cuenta p { margin: 0 0 12px; color: var(--tenue); font-size: 10px; line-height: 1.9; }
  .cuenta code { display: block; padding: 10px; background: #0c0a14; color: #c8f4ff; word-break: break-all; margin: 0 0 12px; font: inherit; }
  .cuenta form { display: flex; gap: 8px; flex-wrap: wrap; }
  .cuenta input { flex: 1 1 220px; font: inherit; padding: 10px; background: #0c0a14; color: #fff4b0; border: 3px solid #4a4470; }
  .cuenta button { font: inherit; padding: 10px 14px; background: #4a4470; color: #fff; border: 3px solid #140f22; box-shadow: 0 4px 0 #2a2448; cursor: pointer; }
  .cuenta .ok, .cuenta p.ok { color: #7cf09a; } .cuenta .mal, .cuenta p.mal { color: #ff6a6a; }
  .cuenta a { color: #c8f4ff; }
  .cuenta .google { margin: 0 0 12px; min-height: 44px; }
  .cuenta button:disabled { opacity: .5; }
  footer { margin-top: 28px; color: var(--tenue); font-size: 9px; }
  footer a { color: var(--tenue); }
  @media (max-width: 480px) { body { font-size: 10px; } td, th { padding: 8px 5px; } .ocultable { display: none; } }
</style>
</head>
<body>
<main>
  <h1>POTRERO <span>404</span></h1>
  <p class="sub"><span><i class="vivo"></i>ranking en vivo</span><span id="hora"></span></p>
  <table aria-label="Ranking">
    <thead><tr><th class="num">#</th><th>Jugador</th><th class="num">Elo</th><th class="num">Ganados</th><th class="num ocultable">Jugados</th></tr></thead>
    <tbody id="tabla"><tr><td colspan="5" class="estado">cargando…</td></tr></tbody>
  </table>
  <div class="acciones">
    <a class="boton" href="../">jugar</a>
    <a class="boton gris" href="https://kvothesson.com/">kvothesson.com</a>
  </div>
  <section class="cuenta" id="cuenta"></section>
  <footer>Humanos e IAs en la misma tabla, ordenados por Elo. Las IAs tienen el robotito. Se actualiza cada 20 segundos.</footer>
</main>
<script type="module">
import { GOOGLE_CLIENT_ID } from '../src/cuentas-config.js';
// Mismo servidor que usa el juego (ver src/red.js)
const local = /^(localhost|127\.0\.0\.1|\[::1\])(:|$)/.test(location.host);
const API = local ? `${location.protocol}//${location.host}` : 'https://potrero-404.kvothesson.workers.dev';
let yo = null;
try { yo = JSON.parse(localStorage.getItem('potrero404.yo')); } catch { /* sin almacenamiento */ }

// robotito en pixel art (el mismo ícono del juego)
const ROBOT = ['....r....', '....g....', '.ggggggg.', '.gwgggwg.', '.ggggggg.', '.g.www.g.', '.ggggggg.', '..g...g..', '.gg...gg.'];
const robot = (() => {
  const c = document.createElement('canvas'); c.width = 9; c.height = 9; const g = c.getContext('2d');
  const col = { r: '#e43a3a', g: '#9890b8', w: '#ffffff' };
  ROBOT.forEach((f, y) => [...f].forEach((ch, x) => { if (col[ch]) { g.fillStyle = col[ch]; g.fillRect(x, y, 1, 1); } }));
  return c.toDataURL();
})();

const escapar = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fila(f) {
  const clases = [f.puesto <= 3 ? 'podio' : '', f.ia ? 'ia' : '', f.yo ? 'vos' : ''].join(' ');
  const icono = f.ia ? `<img class="robot" src="${robot}" alt="IA" title="IA">` : '';
  return `<tr class="${clases}"><td class="num pos">${f.puesto}</td><td class="nombre">${icono}${escapar(f.nombre)}</td>` +
    `<td class="num elo">${f.elo}</td><td class="num">${f.victorias}</td><td class="num ocultable">${f.partidas}</td></tr>`;
}
async function cargar() {
  const tabla = document.getElementById('tabla');
  try {
    const r = await fetch(`${API}/ranking${yo && yo.id ? `?yo=${encodeURIComponent(yo.id)}` : ''}`);
    if (!r.ok) throw new Error();
    const d = await r.json();
    if (abierto !== d.entrar) { abierto = !!d.entrar; pintarCuenta(); }
    let html = d.lista.map(fila).join('');
    if (d.propio) html += `<tr class="separa"><td colspan="5"></td></tr>${fila(d.propio)}`;
    tabla.innerHTML = html || '<tr><td colspan="5" class="estado">todavía no jugó nadie</td></tr>';
    document.getElementById('hora').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch {
    tabla.innerHTML = '<tr><td colspan="5" class="estado">no se pudo cargar: probá de nuevo en un rato</td></tr>';
  }
}
// Tu cuenta: entrar con Google o con un código por mail. Sin contraseñas.
// Entrar une la cuenta al jugador de este navegador (conservás el puesto) y te deja jugar
// desde cualquier dispositivo entrando igual.
let cuentas = [];
let abierto = false; // el servidor avisa si ya se puede entrar (en /ranking)
const guardar = (y) => { yo = y; try { y ? localStorage.setItem('potrero404.yo', JSON.stringify(y)) : localStorage.removeItem('potrero404.yo'); } catch { /* sin almacenamiento */ } };
const post = async (ruta, cuerpo) => {
  try {
    const r = await fetch(`${API}${ruta}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(cuerpo) });
    return await r.json();
  } catch { return { error: 'servidor' }; }
};
const ERRORES = {
  mail: 'Ese mail no parece bien escrito.', espera: 'Esperá un minuto antes de pedir otro código.',
  muchos: 'Pediste muchos códigos. Probá más tarde.', envio: 'No se pudo mandar el mail. Probá en un rato.',
  codigo: 'El código no coincide.', vencido: 'El código venció o se usó demasiadas veces. Pedí otro.',
  google: 'Google no confirmó la cuenta. Probá de nuevo.', nombre: 'El nombre tiene que tener entre 2 y 16 letras o números.',
  sinConfigurar: 'Todavía no está listo para entrar. Volvé en un rato.', servidor: 'Algo falló. Probá en un rato.',
};
const NOMBRE_PROVEEDOR = { google: 'Google', mail: 'tu mail' };
let pendiente = null; // lo que se mandó a /entrar y falta completar con un nombre
let mailEnviado = '';

async function listo(r) {
  guardar({ id: r.id, llave: r.llave, nombre: r.nombre });
  pendiente = null;
  await traerCuentas();
  pintarCuenta('inicio', `Listo: entraste como ${escapar(r.nombre)}.`, true);
  cargar();
}
async function entrarCon(datos) {
  pendiente = datos;
  const r = await post('/entrar', { ...datos, id: yo?.id, llave: yo?.llave });
  if (r.necesitaNombre) { pintarCuenta('nombre'); return; }
  if (r.error) { pintarCuenta(datos.mail ? 'codigo' : 'inicio', ERRORES[r.error] || ERRORES.servidor); return; }
  await listo(r);
}
async function traerCuentas() {
  cuentas = [];
  if (!yo?.id) return;
  try {
    const r = await fetch(`${API}/yo?id=${encodeURIComponent(yo.id)}&llave=${encodeURIComponent(yo.llave)}`);
    if (!r.ok) return; // nunca borrar tu identidad por un error: solo no mostrar las cuentas
    const d = await r.json(); cuentas = d.cuentas || []; yo.nombre = d.nombre;
  } catch { /* sin red */ }
}
function formas(ya) {
  if (!abierto) return '<p>Muy pronto vas a poder entrar con Google o con tu mail.</p>';
  let h = '';
  if (GOOGLE_CLIENT_ID && !ya.includes('google')) h += '<div id="google" class="google"></div>';
  if (!ya.includes('mail')) h += '<form id="fm"><input id="mail" type="email" autocomplete="email" placeholder="tu mail"><button>mandame un código</button></form>';
  return h;
}
function pintarCuenta(paso = 'inicio', aviso = '', bien = false) {
  const c = document.getElementById('cuenta');
  const avisoHtml = aviso ? `<p class="${bien ? 'ok' : 'mal'}">${aviso}</p>` : '';
  if (paso === 'codigo') {
    c.innerHTML = `<h2>Revisá tu mail</h2><p>Te mandamos un código de 6 números a <b>${escapar(mailEnviado)}</b>. Si no aparece, mirá en spam.</p>
      <form id="f"><input id="v" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"><button>entrar</button></form>
      ${avisoHtml}<p><a href="#" id="volver">usar otro mail</a></p>`;
    document.getElementById('f').onsubmit = (e) => { e.preventDefault(); entrarCon({ mail: mailEnviado, codigo: document.getElementById('v').value.trim() }); };
    document.getElementById('volver').onclick = (e) => { e.preventDefault(); pintarCuenta(); };
    document.getElementById('v').focus();
    return;
  }
  if (paso === 'nombre') {
    c.innerHTML = `<h2>Elegí tu nombre</h2><p>Es la primera vez que entrás. Este nombre es el que se ve en el ranking.</p>
      <form id="f"><input id="v" maxlength="16" placeholder="tu nombre" autocomplete="nickname"><button>listo</button></form>${avisoHtml}`;
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      const r = await post('/entrar', { ...pendiente, nombre: document.getElementById('v').value.trim() });
      if (r.error) { pintarCuenta('nombre', ERRORES[r.error] || ERRORES.servidor); return; }
      await listo(r);
    };
    document.getElementById('v').focus();
    return;
  }
  const unidas = cuentas.map((p) => NOMBRE_PROVEEDOR[p]).filter(Boolean);
  let html;
  if (yo?.id && unidas.length) {
    html = `<h2>Tu cuenta: ${escapar(yo.nombre || '')}</h2>
      <p>Entraste con ${unidas.join(' y ')}. Para jugar en otro dispositivo, entrá igual ahí y seguís con el mismo puesto.</p>
      ${abierto && formas(cuentas) ? '<p>También podés sumar otra forma de entrar:</p>' + formas(cuentas) : ''}
      <p><a href="#" id="salir">salir en este navegador</a></p>`;
  } else if (yo?.id) {
    html = `<h2>Guardá tu puesto, ${escapar(yo.nombre || '')}</h2>
      <p>Ahora solo te recuerda este navegador. Entrá con Google o con tu mail y vas a poder jugar desde cualquier dispositivo con el mismo nombre y puesto. No hay contraseña.</p>${formas([])}`;
  } else {
    html = `<h2>Entrar</h2>
      <p>¿Ya jugaste en otro dispositivo? Entrá igual que ahí. Si es la primera vez, podés entrar acá o simplemente tocar online en el juego.</p>${formas([])}`;
  }
  c.innerHTML = html + avisoHtml;
  const salir = document.getElementById('salir');
  if (salir) salir.onclick = (e) => { e.preventDefault(); guardar(null); cuentas = []; pintarCuenta(); cargar(); };
  const fm = document.getElementById('fm');
  if (fm) fm.onsubmit = async (e) => {
    e.preventDefault();
    const mail = document.getElementById('mail').value.trim();
    const b = fm.querySelector('button'); b.disabled = true;
    const r = await post('/mail', { mail });
    b.disabled = false;
    if (r.error) { pintarCuenta('inicio', ERRORES[r.error] || ERRORES.servidor); return; }
    mailEnviado = mail; pintarCuenta('codigo');
  };
  const g = document.getElementById('google');
  if (g && window.google?.accounts?.id) window.google.accounts.id.renderButton(g, { theme: 'filled_black', size: 'large', text: 'continue_with', locale: 'es' });
}
if (GOOGLE_CLIENT_ID) {
  const sc = document.createElement('script');
  sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
  sc.onload = () => { window.google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: (r) => entrarCon({ google: r.credential }) }); pintarCuenta(); };
  document.head.appendChild(sc);
}
pintarCuenta();
traerCuentas().then(() => { pintarCuenta(); cargar(); });
setInterval(() => { if (!document.hidden) cargar(); }, 20000);
</script>
</body>
</html>
